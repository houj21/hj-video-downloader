<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% include 'seo/head.html' %}
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

{% set nav_active = '' %}
{% include 'seo/nav.html' %}

<section class="hero hero--short">
  <div class="hero__glow" aria-hidden="true"></div>
  <div class="hero__grid-lines" aria-hidden="true"></div>
  <div class="container hero__content">
    <h1 class="hero__title">页面不存在（404）</h1>
    <p class="hero__sub">这个地址没有对应的内容，也许它已经搬家了。下面是你可能想去的页面：</p>
    <div class="seo-inline-links">
      <a class="btn btn--primary" href="/">视频下载首页</a>
      <a class="btn btn--ghost" href="/summarize">AI 视频总结</a>
      <a class="btn btn--ghost" href="/pricing">定价方案</a>
      <a class="btn btn--ghost" href="/faq">常见问题</a>
      <a class="btn btn--ghost" href="/guides">使用指南</a>
    </div>
  </div>
</section>

<section class="section section--tight">
  <div class="container">
    <div class="section__head">
      <div>
        <h2 class="section__title">热门平台下载入口</h2>
      </div>
    </div>
    <div class="seo-links">
      {% for item in footer_platforms %}<a href="{{ item.path }}" title="{{ item.title }}">{{ item.name }}视频下载</a>{% endfor %}
    </div>
  </div>
</section>

{% include 'seo/footer.html' %}

<div class="toast" id="toast" role="alert" aria-live="assertive"></div>
<script src="/static/js/app.js"></script>
</body>
</html>
